<!DOCTYPE html>
<html lang="id">

<title>Islamic Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f0f2f5;color:#111;height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#authPage{height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.authBox{width:100%;max-width:400px;background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002}.logo{text-align:center;font-size:30px;font-weight:bold;color:#075e54;margin-bottom:8px}.subtitle{text-align:center;color:#777;margin-bottom:25px}.authBox input,.profileBox input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;outline:none}.authBox button,.profileBox button{width:100%;padding:14px;border:0;border-radius:10px;background:#075e54;color:#fff;font-weight:bold;margin-top:4px}.switchAuth{text-align:center;margin-top:18px;color:#075e54;cursor:pointer}
#app{height:100vh;display:flex}.sidebar{width:340px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}.sideHeader{padding:15px;background:#075e54;color:#fff;display:flex;justify-content:space-between;align-items:center}.sideHeader strong{font-size:20px}.headerButtons{display:flex;gap:5px}.headerButtons button,.callButtons button{background:transparent;border:0;color:inherit;font-size:21px;width:40px;height:40px;border-radius:50%}.headerButtons button:hover,.callButtons button:hover{background:#ffffff22}.search{padding:10px;background:#f0f2f5}.search input{width:100%;border:0;outline:0;padding:12px 15px;border-radius:20px}.users{overflow-y:auto;flex:1}.userItem{padding:13px 15px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;cursor:pointer}.userItem:hover{background:#f5f5f5}.avatar{width:48px;height:48px;border-radius:50%;background:#075e54;color:#fff;display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:bold;flex-shrink:0}.userInfo{flex:1;min-width:0}.userName{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userStatus,.chatUserStatus{font-size:12px;color:#777;margin-top:4px}.onlineDot{width:9px;height:9px;border-radius:50%;background:#25d366;display:inline-block;margin-right:5px}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chatHeader{height:70px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:10px 15px;gap:10px}.backBtn{display:none;border:0;background:transparent;font-size:25px}.chatUser{flex:1;min-width:0}.chatUserName{font-weight:bold;font-size:17px}.callButtons{display:flex;gap:4px}.callButtons button{color:#111}.messages{flex:1;overflow-y:auto;padding:20px;background:#e5ddd5;display:flex;flex-direction:column;gap:6px}.message{max-width:75%;padding:9px 11px;border-radius:10px;word-wrap:break-word}.message.me{align-self:flex-end;background:#dcf8c6}.message.them{align-self:flex-start;background:#fff}.messageTime{font-size:10px;color:#777;text-align:right;margin-top:4px}.tick{color:#168aad;font-weight:bold}.emptyChat{height:100%;display:flex;justify-content:center;align-items:center;color:#777;text-align:center}.composer{background:#f0f2f5;padding:10px;display:flex;gap:8px}.composer input{flex:1;border:0;outline:0;padding:13px 16px;border-radius:25px}.sendBtn{width:48px;height:48px;border:0;border-radius:50%;background:#075e54;color:#fff;font-size:20px}
.profilePanel{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:center;z-index:20}.profileBox{width:90%;max-width:400px;background:#fff;padding:25px;border-radius:18px}.profileBox h3{margin-bottom:20px}.closeBtn{background:#777!important}
#callModal{position:fixed;inset:0;background:#000;z-index:50;color:#fff;display:flex;flex-direction:column}.callTop{min-height:75px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:18px;padding:10px}.callTimer{font-size:12px;color:#bbb;margin-top:4px}.videos{flex:1;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#080808}#remoteVideo{width:100%;height:100%;object-fit:cover;background:#111}#localVideo{position:absolute;right:15px;top:15px;width:120px;height:170px;object-fit:cover;background:#222;border-radius:12px;border:2px solid #fff;z-index:2}.audioAvatar,.incomingAvatar{width:110px;height:110px;border-radius:50%;background:#075e54;display:flex;justify-content:center;align-items:center;font-size:45px}.callBottom{min-height:105px;display:flex;justify-content:center;align-items:center;gap:15px;padding:20px}.callBottom button{width:55px;height:55px;border:0;border-radius:50%;font-size:22px}.endCall,.reject{background:#e53935!important;color:#fff}.incoming{position:fixed;inset:0;background:#000e;z-index:60;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.incomingAvatar{margin-bottom:20px}.incomingButtons{display:flex;gap:35px;margin-top:30px}.incomingButtons button{width:65px;height:65px;border:0;border-radius:50%;font-size:25px}.accept{background:#25d366;color:#fff}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:20px;z-index:100;display:none;max-width:90%;text-align:center}.statusSmall{font-size:12px;color:#aaa;margin-top:3px}.callConnected{color:#25d366}.callConnecting{color:#aaa}
body.dark{background:#111;color:#eee}body.dark .sidebar,body.dark .chatHeader,body.dark .profileBox,body.dark .authBox{background:#202c33;color:#eee}body.dark .userItem{border-color:#344047}body.dark .userItem:hover{background:#2a3942}body.dark .search,body.dark .composer{background:#202c33}body.dark .search input,body.dark .composer input,body.dark .profileBox input,body.dark .authBox input{background:#2a3942;color:#fff}body.dark .message.them{background:#202c33;color:#eee}body.dark .message.me{background:#005c4b;color:#fff}body.dark .chatHeader{border-color:#344047}body.dark .callButtons button{color:#eee}
@media(max-width:700px){.sidebar{width:100%}.chat{display:none}#app.chatOpen .sidebar{display:none}#app.chatOpen .chat{display:flex}.backBtn{display:block}.message{max-width:85%}#localVideo{width:105px;height:150px;right:10px;top:10px}.callBottom{gap:10px}.callBottom button{width:52px;height:52px}}

</head>
<body>
<div id="authPage"><div class="authBox"><div class="logo">☪ Islamic Messenger</div><div class="subtitle">Messenger sederhana untuk komunikasi</div><div id="loginForm"><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button onclick="login()">Masuk</button><div class="switchAuth" onclick="showRegister()">Belum punya akun? Daftar</div></div><div id="registerForm" class="hidden"><input id="registerName" type="text" placeholder="Nama"><input id="registerEmail" type="email" placeholder="Email"><input id="registerPassword" type="password" placeholder="Password minimal 6 karakter"><button onclick="register()">Daftar</button><div class="switchAuth" onclick="showLogin()">Sudah punya akun? Masuk</div></div></div></div>
<div id="app" class="hidden"><div class="sidebar"><div class="sideHeader"><strong>Islamic Messenger</strong><div class="headerButtons"><button onclick="toggleDark()">🌙</button><button onclick="openProfile()">👤</button><button onclick="logout()">⎋</button></div></div><div class="search"><input id="searchInput" placeholder="Cari pengguna..." oninput="renderUsers()"></div><div id="usersList" class="users"></div></div><div class="chat"><div class="chatHeader"><button class="backBtn" onclick="closeChat()">‹</button><div class="avatar" id="chatAvatar">?</div><div class="chatUser"><div class="chatUserName" id="chatUserName">Pilih pengguna</div><div class="chatUserStatus" id="chatUserStatus">-</div></div><div class="callButtons"><button id="audioCallBtn" onclick="startCall('audio')" title="Panggilan suara">📞</button><button id="videoCallBtn" onclick="startCall('video')" title="Video call">📹</button></div></div><div id="messages" class="messages"><div class="emptyChat">Pilih pengguna untuk mulai chat</div></div><div class="composer"><input id="messageInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="sendBtn" onclick="sendMessage()">➤</button></div></div></div>
<div id="profilePanel" class="profilePanel hidden"><div class="profileBox"><h3>Profil Saya</h3><input id="profileName" placeholder="Nama"><button onclick="saveProfile()">Simpan</button><button class="closeBtn" onclick="closeProfile()">Tutup</button></div></div>
<div id="callModal" class="hidden"><div class="callTop"><span id="callTitle">Panggilan</span><span id="callTimer" class="callTimer">00:00</span></div><div class="videos"><div id="audioAvatar" class="audioAvatar">☪</div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div><div class="callBottom"><button id="muteButton" onclick="toggleMute()">🎤</button><button id="cameraButton" onclick="toggleCamera()">📷</button><button onclick="switchCamera()">🔄</button><button id="speakerButton" onclick="toggleSpeaker()">🔊</button><button class="endCall" onclick="endCall()">📞</button></div></div>
<div id="incomingCall" class="incoming hidden"><div class="incomingAvatar">☪</div><h2 id="incomingName">Panggilan masuk</h2><p id="incomingType">Panggilan suara</p><div class="incomingButtons"><button class="reject" onclick="rejectIncoming()">✕</button><button class="accept" onclick="acceptIncoming()">✓</button></div></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getDatabase,ref,set,update,get,onDisconnect,onValue,push,onChildAdded,remove}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCc6z4rmUS5wKtSwJ_oTG4RdL7qLYXK6ZM",authDomain:"islamic-messenger-9d1d5.firebaseapp.com",databaseURL:"https://islamic-messenger-9d1d5-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"islamic-messenger-9d1d5",storageBucket:"islamic-messenger-9d1d5.firebasestorage.app",messagingSenderId:"857632146308",appId:"1:857632146308:web:4712c87c3a3af0bd12d3d1"};
const appFirebase=initializeApp(firebaseConfig),auth=getAuth(appFirebase),db=getDatabase(appFirebase);
const rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun2.l.google.com:19302"}]};
let currentUser=null,selectedUser=null,usersData={},currentCall=null,peerConnection=null,localStream=null,remoteStream=null,callListener=null,candidateListener=null,incomingCallsListener=null,incomingCallData=null,pendingCallId=null,callType="audio",remoteCandidateQueue=[],remoteDescriptionSet=false,unsubscribeUsers=null,unsubscribeMessages=null,processedCandidates=new Set(),callTimerInterval=null,callStartedAt=null,isEndingCall=false,audioCtx=null,ringOsc=null,ringGain=null,ringTimer=null,ringing=false,remoteAudioMuted=false;
const $=id=>document.getElementById(id);
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
window.showRegister=()=>{$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden")};window.showLogin=()=>{$("registerForm").classList.add("hidden");$("loginForm").classList.remove("hidden")};
window.login=async()=>{const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||!password)return toast("Email dan password wajib diisi.");try{await signInWithEmailAndPassword(auth,email,password)}catch(e){toast(e.message)}};
window.register=async()=>{const name=$("registerName").value.trim(),email=$("registerEmail").value.trim(),password=$("registerPassword").value;if(!name||!email||!password)return toast("Semua data wajib diisi.");if(password.length<6)return toast("Password minimal 6 karakter.");try{const c=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(c.user,{displayName:name});await set(ref(db,"users/"+c.user.uid),{uid:c.user.uid,name,email,online:true,lastSeen:Date.now()})}catch(e){toast(e.message)}};
window.logout=async()=>{try{stopRingtone();if(currentCall){await update(ref(db,"calls/"+currentCall),{status:"ended",endedAt:Date.now()}).catch(()=>{});cleanupCall()}if(currentUser)await update(ref(db,"users/"+currentUser.uid),{online:false,lastSeen:Date.now()}).catch(()=>{});await signOut(auth)}catch(e){console.error(e)}};
onAuthStateChanged(auth,async user=>{if(user){currentUser=user;$('authPage').classList.add('hidden');$('app').classList.remove('hidden');await ensureUser();setupPresence();listenUsers();listenIncomingCalls();cleanupOwnOldCalls()}else{currentUser=null;$('authPage').classList.remove('hidden');$('app').classList.add('hidden');stopRingtone()}});
async function ensureUser(){const r=ref(db,"users/"+currentUser.uid),s=await get(r);const base={uid:currentUser.uid,name:currentUser.displayName||currentUser.email.split("@")[0],email:currentUser.email,online:true,lastSeen:Date.now()};s.exists()?await update(r,{online:true,lastSeen:Date.now()}):await set(r,base)}
function setupPresence(){const r=ref(db,"users/"+currentUser.uid);onDisconnect(r).update({online:false,lastSeen:Date.now()})}
function listenUsers(){if(unsubscribeUsers)unsubscribeUsers();unsubscribeUsers=onValue(ref(db,"users"),s=>{usersData=s.val()||{};renderUsers()})}
window.renderUsers=()=>{if(!currentUser)return;const q=$("searchInput").value.toLowerCase(),list=$("usersList");list.innerHTML="";Object.values(usersData).filter(u=>u.uid!==currentUser.uid&&(u.name||"").toLowerCase().includes(q)).forEach(u=>{const item=document.createElement("div");item.className="userItem";item.innerHTML=`<div class="avatar">${esc((u.name||"?").charAt(0).toUpperCase())}</div><div class="userInfo"><div class="userName">${esc(u.name||"Pengguna")}</div><div class="userStatus">${u.online?'<span class="onlineDot"></span>Online':'Offline'}</div></div>`;item.onclick=()=>selectUser(u);list.appendChild(item)})};
function esc(t){return String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
window.selectUser=u=>{selectedUser=u;$('app').classList.add('chatOpen');$('chatUserName').textContent=u.name||'Pengguna';$('chatUserStatus').textContent=u.online?'Online':'Offline';$('chatAvatar').textContent=(u.name||'?').charAt(0).toUpperCase();listenMessages()};window.closeChat=()=>$('app').classList.remove('chatOpen');
function conversationId(){return[currentUser.uid,selectedUser.uid].sort().join("_")}
function listenMessages(){if(unsubscribeMessages)unsubscribeMessages();const r=ref(db,"messages/"+conversationId());unsubscribeMessages=onValue(r,s=>renderMessages(s.val()||{}))}
function renderMessages(messages){const box=$("messages");box.innerHTML="";const vals=Object.values(messages).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));if(!vals.length){box.innerHTML='<div class="emptyChat">Belum ada pesan.<br>Kirim pesan pertama.</div>';return}vals.forEach(m=>{const d=document.createElement('div');d.className='message '+(m.senderId===currentUser.uid?'me':'them');const time=m.timestamp?new Date(m.timestamp).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';d.innerHTML=`<div>${esc(m.text||'')}</div><div class="messageTime">${time} ${m.senderId===currentUser.uid?'<span class="tick">✓✓</span>':''}</div>`;box.appendChild(d)});box.scrollTop=box.scrollHeight}
window.sendMessage=async()=>{if(!selectedUser)return toast('Pilih pengguna terlebih dahulu.');const i=$("messageInput"),text=i.value.trim();if(!text)return;try{const n=push(ref(db,"messages/"+conversationId()));await set(n,{senderId:currentUser.uid,receiverId:selectedUser.uid,text,timestamp:Date.now(),read:false});i.value=''}catch(e){toast('Pesan gagal dikirim.')}};
window.openProfile=async()=>{$('profilePanel').classList.remove('hidden');const s=await get(ref(db,"users/"+currentUser.uid));$('profileName').value=s.val()?.name||currentUser.displayName||''};window.closeProfile=()=>$('profilePanel').classList.add('hidden');window.saveProfile=async()=>{const name=$('profileName').value.trim();if(!name)return toast('Nama tidak boleh kosong.');try{await update(ref(db,"users/"+currentUser.uid),{name});await updateProfile(currentUser,{displayName:name});closeProfile();toast('Profil berhasil disimpan.')}catch(e){toast('Profil gagal disimpan.')}};
window.toggleDark=()=>{document.body.classList.toggle('dark');localStorage.setItem('islamicDark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('islamicDark')==='1')document.body.classList.add('dark');
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}
function startRingtone(pattern='outgoing'){try{ensureAudio();stopRingtone();ringing=true;ringOsc=audioCtx.createOscillator();ringGain=audioCtx.createGain();ringOsc.type='sine';ringOsc.frequency.value=pattern==='incoming'?880:620;ringGain.gain.value=0;ringOsc.connect(ringGain);ringGain.connect(audioCtx.destination);ringOsc.start();const on=()=>{if(!ringing)return;ringGain.gain.setTargetAtTime(.09,audioCtx.currentTime,.01)};const off=()=>{if(!ringing)return;ringGain.gain.setTargetAtTime(0,audioCtx.currentTime,.01)};on();ringTimer=setInterval(()=>{off();setTimeout(on,pattern==='incoming'?350:500)},pattern==='incoming'?1000:1500)}catch(e){console.warn('Ringtone unavailable',e)}}
function stopRingtone(){ringing=false;if(ringTimer){clearInterval(ringTimer);ringTimer=null}try{if(ringGain&&audioCtx)ringGain.gain.setValueAtTime(0,audioCtx.currentTime);if(ringOsc)ringOsc.stop()}catch(e){}ringOsc=null;ringGain=null}
async function prepareLocalMedia(type){if(!window.isSecureContext)throw new Error('Halaman tidak berjalan melalui HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Browser tidak menyediakan kamera/mikrofon.');localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:type==='video'?{facingMode:'user',width:{ideal:1280},height:{ideal:720}}:false});$('localVideo').srcObject=localStream;$('localVideo').style.display=type==='video'?'block':'none'}
function createPeerConnection(){peerConnection=new RTCPeerConnection(rtcConfig);remoteStream=new MediaStream();$('remoteVideo').srcObject=remoteStream;localStream?.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));peerConnection.ontrack=e=>{(e.streams[0]?.getTracks()||[e.track]).forEach(t=>{if(!remoteStream.getTracks().some(x=>x.id===t.id))remoteStream.addTrack(t)});$('remoteVideo').play().catch(()=>{})};peerConnection.onicecandidate=async e=>{if(!e.candidate||!currentCall||!currentUser)return;try{const n=push(ref(db,`calls/${currentCall}/candidates/${currentUser.uid}`));await set(n,e.candidate.toJSON())}catch(x){console.warn(x)}};peerConnection.onconnectionstatechange=()=>{if(!peerConnection)return;const s=peerConnection.connectionState;if(s==='connected'){setCallTitle('Terhubung',true);startCallTimer()}else if(s==='connecting'){setCallTitle('Menghubungkan...',false)}else if(s==='failed'){setCallTitle('Koneksi gagal',false);toast('Koneksi panggilan gagal.');setTimeout(()=>{if(currentCall)endCall()},1000)}else if(s==='disconnected'){setCallTitle('Koneksi terputus',false)}}}
function setCallTitle(t,ok){const e=$('callTitle');e.textContent=t;e.classList.toggle('callConnected',ok);e.classList.toggle('callConnecting',!ok)}
function startCallTimer(){if(callTimerInterval)return;callStartedAt=Date.now();callTimerInterval=setInterval(()=>{const s=Math.floor((Date.now()-callStartedAt)/1000);$('callTimer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000)}function stopCallTimer(){clearInterval(callTimerInterval);callTimerInterval=null;callStartedAt=null;$('callTimer').textContent='00:00'}
function listenCandidates(callId,remoteUid){candidateListener?.();processedCandidates=new Set();remoteCandidateQueue=[];candidateListener=onChildAdded(ref(db,`calls/${callId}/candidates/${remoteUid}`),async s=>{if(processedCandidates.has(s.key))return;processedCandidates.add(s.key);const c=new RTCIceCandidate(s.val());if(peerConnection&&remoteDescriptionSet){try{await peerConnection.addIceCandidate(c)}catch(e){console.warn(e)}}else remoteCandidateQueue.push(c)})}
async function processCandidateQueue(){for(const c of remoteCandidateQueue.splice(0)){try{await peerConnection?.addIceCandidate(c)}catch(e){console.warn(e)}}}
async function callBusy(uid){const s=await get(ref(db,'activeCalls/'+uid));return s.exists()&&s.val()?.callId}
async function claimCall(receiverUid,callId){const active=await get(ref(db,'activeCalls/'+receiverUid));if(active.exists()&&active.val()?.callId){return false}await set(ref(db,'activeCalls/'+currentUser.uid),{callId,peer:receiverUid,updatedAt:Date.now()});await set(ref(db,'activeCalls/'+receiverUid),{callId,peer:currentUser.uid,updatedAt:Date.now()});return true}
async function releaseCallClaims(callId){for(const uid of [currentUser?.uid,selectedUser?.uid,incomingCallData?.callerId,incomingCallData?.receiverId]){if(!uid)continue;const r=ref(db,'activeCalls/'+uid);const s=await get(r).catch(()=>null);if(s?.exists()&&s.val()?.callId===callId)await remove(r).catch(()=>{})}}
window.startCall=async type=>{if(!selectedUser)return toast('Pilih pengguna terlebih dahulu.');if(currentCall||peerConnection||localStream)return toast('Anda sedang berada dalam panggilan.');callType=type;isEndingCall=false;try{const busy=await callBusy(selectedUser.uid);if(busy)return toast('Pengguna sedang dalam panggilan lain.');const callRef=push(ref(db,'calls')),id=callRef.key;if(!await claimCall(selectedUser.uid,id)){toast('Pengguna sedang dalam panggilan lain.');return}currentCall=id;await set(callRef,{callerId:currentUser.uid,receiverId:selectedUser.uid,type,status:'ringing',createdAt:Date.now()});await prepareLocalMedia(type);createPeerConnection();const offer=await peerConnection.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:type==='video'});await peerConnection.setLocalDescription(offer);await update(callRef,{offer:{type:offer.type,sdp:offer.sdp}});showCallScreen(type,'Memanggil '+(selectedUser.name||'Pengguna'));startRingtone('outgoing');listenCallAsCaller(id);listenCandidates(id,selectedUser.uid)}catch(e){console.error(e);if(currentCall)await update(ref(db,'calls/'+currentCall),{status:'ended'}).catch(()=>{});await releaseCallClaims(currentCall);cleanupCall();toast('Panggilan gagal: '+(e.message||e.name))}};
function listenCallAsCaller(id){callListener?.();callListener=onValue(ref(db,'calls/'+id),async s=>{const d=s.val();if(!d)return;if(d.answer&&peerConnection&&!remoteDescriptionSet){try{await peerConnection.setRemoteDescription(new RTCSessionDescription(d.answer));remoteDescriptionSet=true;await processCandidateQueue();stopRingtone();setCallTitle('Menghubungkan...',false)}catch(e){console.error(e)}}if(d.status==='rejected'){stopRingtone();toast('Panggilan ditolak.');cleanupCall()}else if(d.status==='busy'){stopRingtone();toast('Pengguna sedang dalam panggilan lain.');cleanupCall()}else if(d.status==='ended'){if(!isEndingCall)toast('Panggilan diakhiri.');stopRingtone();cleanupCall()}})}
function listenIncomingCalls(){incomingCallsListener?.();incomingCallsListener=onValue(ref(db,'calls'),s=>{if(!currentUser||currentCall||incomingCallData)return;const entries=Object.entries(s.val()||{});const found=entries.find(([id,c])=>c?.receiverId===currentUser.uid&&c.status==='ringing'&&c.offer&&Date.now()-(c.createdAt||0)<120000);if(!found)return;const[id,c]=found;get(ref(db,'activeCalls/'+currentUser.uid)).then(a=>{if(a.exists()&&a.val()?.callId){update(ref(db,'calls/'+id),{status:'busy'}).catch(()=>{});return}incomingCallData={id,...c};pendingCallId=id;$('incomingName').textContent=usersData[c.callerId]?.name||'Pengguna';$('incomingType').textContent=c.type==='video'?'📹 Panggilan video masuk':'📞 Panggilan suara masuk';$('incomingCall').classList.remove('hidden');startRingtone('incoming')})})}
window.acceptIncoming=async()=>{if(!incomingCallData)return;const c=incomingCallData;stopRingtone();$('incomingCall').classList.add('hidden');incomingCallData=null;pendingCallId=null;currentCall=c.id;callType=c.type;isEndingCall=false;try{const active=await get(ref(db,'activeCalls/'+currentUser.uid));if(active.exists()&&active.val()?.callId&&active.val().callId!==c.id){await update(ref(db,'calls/'+c.id),{status:'busy'});cleanupCall();toast('Anda sedang dalam panggilan lain.');return}await set(ref(db,'activeCalls/'+currentUser.uid),{callId:c.id,peer:c.callerId,updatedAt:Date.now()});await prepareLocalMedia(c.type);createPeerConnection();await peerConnection.setRemoteDescription(new RTCSessionDescription(c.offer));remoteDescriptionSet=true;listenCandidates(c.id,c.callerId);await processCandidateQueue();const answer=await peerConnection.createAnswer({offerToReceiveAudio:true,offerToReceiveVideo:c.type==='video'});await peerConnection.setLocalDescription(answer);await update(ref(db,'calls/'+c.id),{answer:{type:answer.type,sdp:answer.sdp},status:'accepted'});showCallScreen(c.type,'Menghubungkan...');listenCallAsReceiver(c.id)}catch(e){console.error(e);await update(ref(db,'calls/'+c.id),{status:'ended'}).catch(()=>{});cleanupCall();toast('Tidak dapat menerima panggilan: '+(e.message||e.name))}};
function listenCallAsReceiver(id){callListener?.();callListener=onValue(ref(db,'calls/'+id),s=>{const d=s.val();if(d?.status==='ended'){if(!isEndingCall)toast('Panggilan diakhiri.');cleanupCall()}})}
window.rejectIncoming=async()=>{const id=pendingCallId||incomingCallData?.id;stopRingtone();$('incomingCall').classList.add('hidden');incomingCallData=null;pendingCallId=null;if(id){await update(ref(db,'calls/'+id),{status:'rejected',endedAt:Date.now()}).catch(()=>{})}};
function showCallScreen(type,title){$('callModal').classList.remove('hidden');setCallTitle(title,false);$('callTimer').textContent='00:00';$('remoteVideo').style.display=type==='video'?'block':'none';$('localVideo').style.display=type==='video'?'block':'none';$('audioAvatar').style.display=type==='video'?'none':'flex';$('cameraButton').style.display=type==='video'?'block':'none';$('speakerButton').textContent='🔊'}
window.toggleMute=()=>{const a=localStream?.getAudioTracks()||[];if(!a.length)return toast('Mikrofon tidak tersedia.');const on=a[0].enabled;a.forEach(t=>t.enabled=!on);$('muteButton').textContent=on?'🔇':'🎤'};
window.toggleCamera=()=>{const v=localStream?.getVideoTracks()||[];if(!v.length)return toast('Kamera hanya tersedia saat video call.');const on=v[0].enabled;v.forEach(t=>t.enabled=!on);$('cameraButton').textContent=on?'🚫':'📷'};
window.switchCamera=async()=>{const old=localStream?.getVideoTracks()?.[0];if(!old)return toast('Ganti kamera hanya tersedia saat video call.');const facing=old.getSettings().facingMode==='environment'?'user':'environment';try{const ns=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing}}),nt=ns.getVideoTracks()[0],sender=peerConnection?.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(nt);nt.enabled=old.enabled;old.stop();localStream.removeTrack(old);localStream.addTrack(nt);$('localVideo').srcObject=localStream}catch(e){toast('Tidak dapat mengganti kamera: '+e.message)}};
window.toggleSpeaker=()=>{const v=$('remoteVideo');remoteAudioMuted=!remoteAudioMuted;v.muted=remoteAudioMuted;$('speakerButton').textContent=remoteAudioMuted?'🔇':'🔊'};
window.endCall=async()=>{if(isEndingCall)return;isEndingCall=true;const id=currentCall;if(id)await update(ref(db,'calls/'+id),{status:'ended',endedAt:Date.now()}).catch(()=>{});await releaseCallClaims(id);cleanupCall()};
function cleanupCall(){stopRingtone();stopCallTimer();callListener?.();candidateListener?.();callListener=null;candidateListener=null;if(peerConnection){peerConnection.ontrack=null;peerConnection.onicecandidate=null;try{peerConnection.close()}catch(e){}}peerConnection=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;remoteStream=null;currentCall=null;pendingCallId=null;remoteCandidateQueue=[];processedCandidates=new Set();remoteDescriptionSet=false;incomingCallData=null;$('callModal').classList.add('hidden');$('incomingCall').classList.add('hidden');$('localVideo').srcObject=null;$('remoteVideo').srcObject=null;$('muteButton').textContent='🎤';$('cameraButton').textContent='📷';isEndingCall=false}
async function cleanupOwnOldCalls(){if(!currentUser)return;try{const s=await get(ref(db,'calls')),calls=s.val()||{};for(const[id,c]of Object.entries(calls)){if(!c)continue;const age=Date.now()-(c.createdAt||0);if((c.callerId===currentUser.uid||c.receiverId===currentUser.uid)&&['ringing','accepted'].includes(c.status)&&age>120000){await update(ref(db,'calls/'+id),{status:'ended'}).catch(()=>{})}}}catch(e){console.warn(e)}}
</script></body></html>
