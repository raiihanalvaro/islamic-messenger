<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Islamic Messenger</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif
}

body{
  background:#f0f2f5;
  color:#111;
  height:100vh;
  overflow:hidden
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

/* ================= AUTH ================= */

#authPage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}

.authBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.12)
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#075e54;
  margin-bottom:8px
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px
}

.authBox input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  outline:none
}

.authBox button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#075e54;
  color:white;
  font-weight:bold;
  margin-top:4px
}

.switchAuth{
  text-align:center;
  margin-top:18px;
  color:#075e54;
  cursor:pointer
}

/* ================= APP ================= */

#app{
  height:100vh;
  display:flex
}

.sidebar{
  width:340px;
  background:white;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column
}

.sideHeader{
  padding:15px;
  background:#075e54;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.sideHeader strong{
  font-size:20px
}

.headerButtons{
  display:flex;
  gap:5px
}

.headerButtons button{
  background:transparent;
  border:0;
  color:white;
  font-size:21px;
  width:38px;
  height:38px;
  border-radius:50%
}

.headerButtons button:hover{
  background:rgba(255,255,255,.15)
}

.search{
  padding:10px;
  background:#f0f2f5
}

.search input{
  width:100%;
  border:0;
  outline:0;
  padding:12px 15px;
  border-radius:20px
}

.users{
  overflow-y:auto;
  flex:1
}

.userItem{
  padding:13px 15px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer
}

.userItem:hover{
  background:#f5f5f5
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#075e54;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  font-weight:bold;
  flex-shrink:0
}

.userInfo{
  flex:1;
  min-width:0
}

.userName{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.userStatus{
  font-size:12px;
  color:#777;
  margin-top:4px
}

.onlineDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#25d366;
  display:inline-block;
  margin-right:5px
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0
}

.chatHeader{
  height:70px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:10px 15px;
  gap:10px
}

.backBtn{
  display:none;
  border:0;
  background:transparent;
  font-size:25px
}

.chatUser{
  flex:1;
  min-width:0
}

.chatUserName{
  font-weight:bold;
  font-size:17px
}

.chatUserStatus{
  font-size:12px;
  color:#777;
  margin-top:4px
}

.callButtons{
  display:flex;
  gap:4px
}

.callButtons button{
  border:0;
  background:transparent;
  font-size:21px;
  width:42px;
  height:42px;
  border-radius:50%
}

.callButtons button:hover{
  background:#eee
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#e5ddd5;
  display:flex;
  flex-direction:column;
  gap:6px
}

.message{
  max-width:75%;
  padding:9px 11px;
  border-radius:10px;
  position:relative;
  word-wrap:break-word
}

.message.me{
  align-self:flex-end;
  background:#dcf8c6
}

.message.them{
  align-self:flex-start;
  background:white
}

.messageTime{
  font-size:10px;
  color:#777;
  text-align:right;
  margin-top:4px
}

.tick{
  color:#168aad;
  font-weight:bold
}

.emptyChat{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#777;
  text-align:center
}

.composer{
  background:#f0f2f5;
  padding:10px;
  display:flex;
  gap:8px
}

.composer input{
  flex:1;
  border:0;
  outline:0;
  padding:13px 16px;
  border-radius:25px
}

.sendBtn{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#075e54;
  color:white;
  font-size:20px
}

/* ================= PROFILE ================= */

.profilePanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:20
}

.profileBox{
  width:90%;
  max-width:400px;
  background:white;
  padding:25px;
  border-radius:18px
}

.profileBox h3{
  margin-bottom:20px
}

.profileBox input{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:10px
}

.profileBox button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#075e54;
  color:white;
  margin-top:6px
}

.closeBtn{
  background:#777!important
}

/* ================= CALL SCREEN ================= */

#callModal{
  position:fixed;
  inset:0;
  background:#000;
  z-index:50;
  color:white;
  display:flex;
  flex-direction:column
}

.callTop{
  min-height:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  padding:10px
}

#callTimer{
  font-size:12px;
  color:#bbb;
  margin-top:4px
}

.videos{
  flex:1;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#080808
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111
}

#localVideo{
  position:absolute;
  right:15px;
  top:15px;
  width:120px;
  height:170px;
  object-fit:cover;
  background:#222;
  border-radius:12px;
  border:2px solid white;
  z-index:2
}

.audioAvatar{
  width:110px;
  height:110px;
  border-radius:50%;
  background:#075e54;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:45px
}

.callBottom{
  min-height:105px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  padding:20px
}

.callBottom button{
  width:55px;
  height:55px;
  border:0;
  border-radius:50%;
  font-size:22px
}

.endCall{
  background:#e53935!important;
  color:white
}

/* ================= INCOMING ================= */

.incoming{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.90);
  z-index:60;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center
}

.incomingAvatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#075e54;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  margin-bottom:20px
}

.incomingButtons{
  display:flex;
  gap:35px;
  margin-top:30px
}

.incomingButtons button{
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  font-size:25px
}

.reject{
  background:#e53935;
  color:white
}

.accept{
  background:#25d366;
  color:white
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:20px;
  z-index:100;
  display:none;
  max-width:90%;
  text-align:center
}

/* ================= DARK MODE ================= */

body.dark{
  background:#111;
  color:#eee
}

body.dark .sidebar,
body.dark .chatHeader,
body.dark .profileBox,
body.dark .authBox{
  background:#202c33;
  color:#eee
}

body.dark .userItem{
  border-color:#344047
}

body.dark .userItem:hover{
  background:#2a3942
}

body.dark .search,
body.dark .composer{
  background:#202c33
}

body.dark .search input,
body.dark .composer input,
body.dark .profileBox input,
body.dark .authBox input{
  background:#2a3942;
  color:white
}

body.dark .message.them{
  background:#202c33
}

body.dark .message.me{
  background:#005c4b
}

body.dark .chatHeader{
  border-color:#344047
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .sidebar{
    width:100%
  }

  .chat{
    display:none
  }

  #app.chatOpen .sidebar{
    display:none
  }

  #app.chatOpen .chat{
    display:flex
  }

  .backBtn{
    display:block
  }

  .message{
    max-width:85%
  }

  #localVideo{
    width:105px;
    height:150px;
    right:10px;
    top:10px
  }

  .callBottom{
    gap:12px
  }

  .callBottom button{
    width:52px;
    height:52px
  }

}

/* ================= CALL STATES ================= */

.callConnecting{
  color:#aaa
}

.callConnected{
  color:#25d366
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="authPage">

  <div class="authBox">

    </div>

    </div>

<!-- ================= APP ================= -->

<div

  <div class="sidebar">

<!-- ================= PROFILE ================= -->

<div

>

  <div class="profileBox">

    <input

</div>


<!-- ================= CALL ================= -->

<div
  id="callModal"
  class="hidden"
>

  <div class="callTop">

      Panggilan
    </span>

      00:00
    </span>

  </div>

  <div class="videos">

      id="audioAvatar"

    >

<!-- ================= INCOMING CALL ================= -->

<div
  id="incomingCall"
  class="incoming hidden"
>

  <div class="incomingAvatar">
    ☪
  </div>

  <h2 id="incomingName">
    Panggilan masuk
  </h2>

  <p id="incomingType">
    Panggilan suara
  </p>

  <div class="incomingButtons">

    <button
      class="reject"
      onclick="rejectIncoming()"
      title="Tolak"
    >
      ✕
    </button>

      class="accept"
      onclick="acceptIncoming()"
      title="Terima"
    >
      ✓
    </button>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  get,
  onValue,
  push,
  onDisconnect,
  remove,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCc6z4rmUS5wKtSwJ_oTG4RdL7qLYXK6ZM",

  authDomain:
    "islamic-messenger-9d1d5.firebaseapp.com",

  databaseURL:
    "https://islamic-messenger-9d1d5-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "islamic-messenger-9d1d5",

  storageBucket:
    "islamic-messenger-9d1d5.firebasestorage.app",

  messagingSenderId:
    "857632146308",

  appId:
    "1:857632146308:web:4712c87c3a3af0bd12d3d1"

};


const appFirebase =
  initializeApp(firebaseConfig);

const auth =
  getAuth(appFirebase);

const db =
  getDatabase(appFirebase);


/* =========================================================
   WEBRTC CONFIG
========================================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:"stun:stun.l.google.com:19302"
    },
    {
      urls:"stun:stun1.l.google.com:19302"
    },
    {
      urls:"stun:stun2.l.google.com:19302"
    }
  ]

};


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let selectedUser = null;
let usersData = {};

let currentCall = null;
let peerConnection = null;

let localStream = null;
let remoteStream = null;

let callListener = null;
let candidateListener = null;
let incomingCallsListener = null;

let incomingCallData = null;

let callType = "audio";

let pendingCallId = null;

let remoteCandidateQueue = [];

let remoteDescriptionSet = false;

let unsubscribeUsers = null;
let unsubscribeMessages = null;

let processedCandidates = new Set();

let callTimerInterval = null;
let callStartedAt = null;

let isEndingCall = false;


/* =========================================================
   AUTH UI
========================================================= */

window.showRegister = function(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

};


window.showLogin = function(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

};


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message;

  el.style.display =
    "block";

  setTimeout(()=>{

    el.style.display =
      "none";

  },3500);

}


/* =========================================================
   LOGIN
========================================================= */

window.login = async function(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  if(!email || !password){

    toast(
      "Email dan password wajib diisi."
    );

    return;

  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    toast(
      error.message
    );

  }

};


/* =========================================================
   REGISTER
========================================================= */

window.register = async function(){

  const name =
    document
      .getElementById("registerName")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  if(!name || !email || !password){

    toast(
      "Semua data wajib diisi."
    );

    return;

  }

  if(password.length < 6){

    toast(
      "Password minimal 6 karakter."
    );

    return;

  }

  try{

    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(
      credential.user,
      {
        displayName:name
      }
    );

    await set(
      ref(
        db,
        "users/" + credential.user.uid
      ),
      {
        uid:credential.user.uid,
        name:name,
        email:email,
        online:true,
        lastSeen:Date.now()
      }
    );

  }catch(error){

    console.error(error);

    toast(
      error.message
    );

  }

};


/* =========================================================
   LOGOUT
========================================================= */

window.logout = async function(){

  if(currentCall){

    try{

      await update(
        ref(
          db,
          "calls/" + currentCall
        ),
        {
          status:"ended"
        }
      );

    }catch(e){}

    cleanupCall();

  }

  if(currentUser){

    try{

      await update(
        ref(
          db,
          "users/" +
          currentUser.uid
        ),
        {
          online:false,
          lastSeen:Date.now()
        }
      );

    }catch(e){}

  }

  await signOut(auth);

};


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      currentUser =
        user;

      document
        .getElementById("authPage")
        .classList.add("hidden");

      document
        .getElementById("app")
        .classList.remove("hidden");

      await ensureUser();

      setupPresence();

      listenUsers();

      listenIncomingCalls();

    }else{

      currentUser =
        null;

      document
        .getElementById("authPage")
        .classList.remove("hidden");

      document
        .getElementById("app")
        .classList.add("hidden");

    }

  }
);


/* =========================================================
   ENSURE USER
========================================================= */

async function ensureUser(){

  const userRef =
    ref(
      db,
      "users/" +

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function listenMessages(){

  if(unsubscribeMessages)
    unsubscribeMessages();

    return;

    ref(
      db,
      "messages/" +
      conversationId()
    );

  unsubscribeMessages =
    onValue(
      messagesRef,
      snapshot => {

        const messages =
          snapshot.val() || {};

        renderMessages(
          messages
        );

      }
    );

function renderMessages(messages){

  const box =
    document.getElementById(
      "messages"
    );

  box.innerHTML = "";

  const values =
    Object
      .values(messages)
      .sort(
        (a,b)=>
          (a.timestamp || 0) -
          (b.timestamp || 0)
      );

  if(!values.length){

    box.innerHTML = `
      <div class="emptyChat">
        Belum ada pesan.<br>
        Kirim pesan pertama.
      </div>
    `;

    return;

  }

  values.forEach(message => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "message " +
      (
        message.senderId ===
        currentUser.uid
        ? "me"
        : "them"
      );

    const time =
      message.timestamp
      ? new Date(
          message.timestamp
        ).toLocaleTimeString(
          "id-ID",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
      : "";

    div.innerHTML = `

      <div>
        ${escapeHtml(
          message.text || ""
        )}
      </div>

      <div class="messageTime">

        ${time}

        ${
          message.senderId ===
          currentUser.uid
          ? '<span class="tick">✓✓</span>'
          : ''
        }

      </div>

    `;

    box.appendChild(div);

  });

  box.scrollTop =
    box.scrollHeight;

}

/* =========================================================
   MEDIA
========================================================= */

async function prepareLocalMedia(type){

  if(!window.isSecureContext){

    throw new Error(
      "Halaman tidak berjalan melalui HTTPS."
    );

  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      "Browser tidak menyediakan akses kamera/mikrofon."
    );

  }

  const constraints = {

    audio:{
      echoCancellation:true,
      noiseSuppression:true,
      autoGainControl:true
    },

    video:
      type === "video"
      ? {
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:720
          }
        }
      : false

  };

  localStream =
    await navigator.mediaDevices
      .getUserMedia(
        constraints
      );

  const localVideo =
    document.getElementById(
      "localVideo"
    );

  localVideo.srcObject =
    localStream;

  localVideo.style.display =
    type === "video"
    ? "block"
    : "none";

  document
    .getElementById(
      "muteButton"
    )
    .textContent =
      "🎤";

  document
    .getElementById(
      "cameraButton"
    )
    .textContent =
      "📷";

}


/* =========================================================
   CREATE PEER CONNECTION
========================================================= */

function createPeerConnection(){

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );

  remoteStream =
    new MediaStream();

  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );

  remoteVideo.srcObject =
    remoteStream;

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  /* REMOTE TRACK */

  peerConnection.ontrack =
    event => {

      const streams =
        event.streams;

      if(
        streams &&
        streams[0]
      ){

        streams[0]
          .getTracks()
          .forEach(track => {

            const alreadyExists =
              remoteStream
                .getTracks()
                .some(
                  t =>
                    t.id === track.id
                );

            if(!alreadyExists){

              remoteStream.addTrack(
                track
              );

            }

          });

      }else{

        if(
          !remoteStream
            .getTracks()
            .some(
              t =>
                t.id === event.track.id
            )
        ){

          remoteStream.addTrack(
            event.track
          );

        }

      }

      remoteVideo.play()
        .catch(()=>{});

    };


  /* ICE CANDIDATE */

  peerConnection.onicecandidate =
    async event => {

      if(
        !event.candidate ||
        !currentCall ||
        !currentUser
      )
        return;

      try{

        const candidateRef =
          push(
            ref(
              db,
              "calls/" +
              currentCall +
              "/candidates/" +
              currentUser.uid
            )
          );

        await set(
          candidateRef,
          event.candidate.toJSON()
        );

      }catch(error){

        console.error(
          "ICE candidate error:",
          error
        );

      }

    };


  /* CONNECTION STATE */

  peerConnection
    .onconnectionstatechange =
    () => {

      if(!peerConnection)
        return;

      const state =
        peerConnection
          .connectionState;

      console.log(
        "WebRTC connection:",
        state
      );

      if(state === "connected"){

        setCallTitle(
          "Terhubung",
          true
        );

        startCallTimer();

      }

      if(state === "connecting"){

        setCallTitle(
          "Menghubungkan...",
          false
        );

      }

      if(state === "failed"){

        setCallTitle(
          "Koneksi gagal",
          false
        );

        toast(
          "Koneksi panggilan gagal."
        );

      }

      if(state === "disconnected"){

        setCallTitle(
          "Koneksi terputus",
          false
        );

      }

      if(state === "closed"){

        stopCallTimer();

      }

    };


  peerConnection.oniceconnectionstatechange =
    () => {

      if(!peerConnection)
        return;

      console.log(
        "ICE:",
        peerConnection
          .iceConnectionState
      );

    };

}

/* =========================================================
   CALL TIMER
========================================================= */

function startCallTimer(){

  if(callTimerInterval)
    return;

  callStartedAt =
    Date.now();

  updateCallTimer();

  callTimerInterval =
    setInterval(
      updateCallTimer,
      1000
    );

}


function updateCallTimer(){

  if(!callStartedAt)
    return;

  const seconds =
    Math.floor(
      (Date.now() -
       callStartedAt) /
      1000
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  document
    .getElementById(
      "callTimer"
    )
    .textContent =
      String(minutes)
        .padStart(2,"0") +
      ":" +
      String(secs)
        .padStart(2,"0");

}


function stopCallTimer(){

  if(callTimerInterval){

    clearInterval(
      callTimerInterval
    );

    callTimerInterval =
      null;

  }

  callStartedAt =
    null;

  document
    .getElementById(
      "callTimer"
    )
    .textContent =
      "00:00";

}


/* =========================================================
   LISTEN ICE CANDIDATES
========================================================= */

function listenCandidates(
  callId,
  remoteUid
){

  if(candidateListener){

    candidateListener();
    candidateListener = null;

  }

  processedCandidates =
    new Set();

  remoteCandidateQueue =
    [];

  const candidatesRef =
    ref(
      db,
      "calls/" +
      callId +
      "/candidates/" +
      remoteUid
    );

  candidateListener =
    onChildAdded(
      candidatesRef,
      async snapshot => {

        const key =
          snapshot.key;

        if(
          processedCandidates
            .has(key)
        )
          return;

        processedCandidates
          .add(key);

        const candidateData =
          snapshot.val();

        if(!candidateData)
          return;

        try{

          const iceCandidate =
            new RTCIceCandidate(
              candidateData
            );

          if(
            peerConnection &&
            remoteDescriptionSet
          ){

            await peerConnection
              .addIceCandidate(
                iceCandidate
              );

          }else{

            remoteCandidateQueue
              .push(
                iceCandidate
              );

          }

        }catch(error){

          console.error(
            "ICE candidate error:",
            error
          );

        }

      }
    );

}


/* =========================================================
   PROCESS QUEUED ICE
========================================================= */

async function processCandidateQueue(){

  if(!peerConnection)
    return;

  const queue =
    [...remoteCandidateQueue];

  remoteCandidateQueue =
    [];

  for(
    const candidate of queue
  ){

    try{

      await peerConnection
        .addIceCandidate(
          candidate
        );

    }catch(error){

      console.error(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =========================================================
   START CALL
========================================================= */

window.startCall =
async function(type){

  if(!selectedUser){

    toast(
      "Pilih pengguna terlebih dahulu."
    );

    return;

  }

  if(
    currentCall ||
    peerConnection ||
    localStream
  ){

    toast(
      "Anda sedang berada dalam panggilan."
    );

    return;

  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    toast(
      "Gunakan Chrome melalui HTTPS untuk panggilan."
    );

    return;

  }

  callType =
    type;

  isEndingCall =
    false;

  try{

    await prepareLocalMedia(
      type
    );

    createPeerConnection();

    const callRef =
      push(
        ref(
          db,
          "calls"
        )
      );

    currentCall =
      callRef.key;

    await set(
      callRef,
      {
        callerId:
          currentUser.uid,

        receiverId:
          selectedUser.uid,

        type:type,

        status:
          "ringing",

        createdAt:
          Date.now()
      }
    );


    const offer =
      await peerConnection
        .createOffer({
          offerToReceiveAudio:true,
          offerToReceiveVideo:
            type === "video"
        });


    await peerConnection
      .setLocalDescription(
        offer
      );


    await update(
      callRef,
      {
        offer:{
          type:
            offer.type,

          sdp:
            offer.sdp
        }
      }
    );


    showCallScreen(
      type,
      "Memanggil " +
      (
        selectedUser.name ||
        "Pengguna"
      )
    );


    listenCallAsCaller(
      currentCall
    );


    listenCandidates(
      currentCall,
      selectedUser.uid
    );


  }catch(error){

    console.error(
      "START CALL:",
      error
    );

    const message =
      error.name +
      " - " +
      error.message;

    if(currentCall){

      try{

        await update(
          ref(
            db,
            "calls/" +
            currentCall
          ),
          {
            status:"ended"
          }
        );

      }catch(e){}

    }

    cleanupCall();

    toast(
      "Panggilan gagal: " +
      message
    );

  }

};


/* =========================================================
   LISTEN CALL AS CALLER
========================================================= */

function listenCallAsCaller(
  callId
){

  if(callListener){

    callListener();
    callListener = null;

  }

  callListener =
    onValue(
      ref(
        db,
        "calls/" +
        callId
      ),
      async snapshot => {

        const data =
          snapshot.val();

        if(!data)
          return;


        /* ANSWER */

        if(
          data.answer &&
          peerConnection &&
          !remoteDescriptionSet
        ){

          try{

            await peerConnection
              .setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );

            remoteDescriptionSet =
              true;

            await processCandidateQueue();

            setCallTitle(
              "Menghubungkan...",
              false
            );

          }catch(error){

            console.error(
              "ANSWER ERROR:",
              error
            );

          }

        }


        /* REJECTED */

        if(
          data.status ===
          "rejected"
        ){

          toast(
            "Panggilan ditolak."
          );

          cleanupCall();

          return;

        }


        /* ENDED */

        if(
          data.status ===
          "ended"
        ){

          if(!isEndingCall){

            toast(
              "Panggilan diakhiri."
            );

          }

          cleanupCall();

          return;

        }

      }
    );

}


/* =========================================================
   INCOMING CALL LISTENER
========================================================= */

function listenIncomingCalls(){

  if(incomingCallsListener){

    incomingCallsListener();
    incomingCallsListener =
      null;

  }

  if(!currentUser)
    return;

  incomingCallsListener =
    onValue(
      ref(db,"calls"),
      snapshot => {

        if(!currentUser)
          return;

        const calls =
          snapshot.val() || {};

        const entries =
          Object.entries(calls);

        const incoming =
          entries.find(
            ([id,call]) =>
              call &&
              call.receiverId ===
                currentUser.uid &&
              call.status ===
                "ringing" &&
              call.offer
          );


        if(!incoming){

          return;

        }


        const [id,data] =
          incoming;


        if(
          currentCall === id ||
          incomingCallData
        ){

          return;

        }


        incomingCallData = {
          id:id,
          ...data
        };

        pendingCallId =
          id;


        const caller =
          usersData[
            data.callerId
          ];


        document
          .getElementById(
            "incomingName"
          )
          .textContent =
            caller?.name ||
            "Pengguna";


        document
          .getElementById(
            "incomingType"
          )
          .textContent =
            data.type === "video"
            ? "📹 Panggilan video masuk"
            : "📞 Panggilan suara masuk";


        document
          .getElementById(
            "incomingCall"
          )
          .classList
          .remove("hidden");

      }
    );

}

/* =========================================================
   ACCEPT INCOMING
========================================================= */

window.acceptIncoming =
async function(){

  if(!incomingCallData)
    return;

  const call =
    incomingCallData;

  document
    .getElementById(
      "incomingCall"
    )
    .classList
    .add("hidden");

  incomingCallData =
    null;

  pendingCallId =
    null;

  currentCall =
    call.id;

  callType =
    call.type;

  isEndingCall =
    false;


  try{

    await prepareLocalMedia(
      call.type
    );

    createPeerConnection();


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          call.offer
        )
      );

    remoteDescriptionSet =
      true;


    listenCandidates(
      call.id,
      call.callerId
    );


    await processCandidateQueue();


    const answer =
      await peerConnection
        .createAnswer({
          offerToReceiveAudio:true,
          offerToReceiveVideo:
            call.type === "video"
        });


    await peerConnection
      .setLocalDescription(
        answer
      );


    await update(
      ref(
        db,
        "calls/" +
        call.id
      ),
      {
        answer:{
          type:
            answer.type,

          sdp:
            answer.sdp
        },

        status:
          "accepted"
      }
    );


    showCallScreen(
      call.type,
      "Menghubungkan..."
    );


    listenCallAsReceiver(
      call.id
    );


  }catch(error){

    console.error(
      "ACCEPT CALL:",
      error
    );

    try{

      await update(
        ref(
          db,
          "calls/" +
          call.id
        ),
        {
          status:"ended"
        }
      );

    }catch(e){}

    cleanupCall();

    toast(
      "Tidak dapat menerima panggilan: " +
      error.name +
      " - " +
      error.message
    );

  }

};

   LISTEN CALL AS RECEIVER

function listenCallAsReceiver(

){

/* =========================================================
   REJECT INCOMING
========================================================= */

window.rejectIncoming =
async function(){

  const callId =
    pendingCallId ||
    incomingCallData?.id;

  if(!callId){

    document
      .getElementById(
        "incomingCall"
      )
      .classList
      .add("hidden");

    incomingCallData =
      null;

    return;

  }


  try{

    await update(
      ref(
        db,
        "calls/" +
        callId
      ),
      {
        status:"rejected"
      }
    );

  }catch(error){

    console.error(error);

  }


  document
    .getElementById(
      "incomingCall"
    )
    .classList
    .add("hidden");

  incomingCallData =
    null;

  pendingCallId =
    null;

};


/* =========================================================
   SHOW CALL SCREEN
========================================================= */

function showCallScreen(
  type,
  title
){

  const modal =
    document.getElementById(
      "callModal"
    );

  modal
    .classList
    .remove("hidden");


  setCallTitle(
    title,
    false
  );


  document
    .getElementById(
      "callTimer"
    )
    .textContent =
      "00:00";


  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );

  const localVideo =
    document.getElementById(
      "localVideo"
    );

  const avatar =
    document.getElementById(
      "audioAvatar"
    );


  if(type === "video"){

    remoteVideo.style.display =
      "block";

    localVideo.style.display =
      "block";

    avatar.style.display =
      "none";

  }else{

    remoteVideo.style.display =
      "none";

    localVideo.style.display =
      "none";

    avatar.style.display =
      "flex";

  }

}


/* =========================================================
   MUTE
========================================================= */

window.toggleMute =
function(){

  if(!localStream)
    return;

  const audio =
    localStream
      .getAudioTracks();

  if(!audio.length){

    toast(
      "Mikrofon tidak tersedia."
    );

    return;

  }


  const enabled =
    audio[0].enabled;


  audio.forEach(
    track => {

      track.enabled =
        !enabled;

    }
  );


  document
    .getElementById(
      "muteButton"
    )
    .textContent =
      enabled
      ? "🔇"
      : "🎤";

};


/* =========================================================
   TOGGLE CAMERA
========================================================= */

window.toggleCamera =
function(){

  if(!localStream)
    return;

  const video =
    localStream
      .getVideoTracks();

  if(!video.length){

    toast(
      "Kamera hanya tersedia saat video call."
    );

  }


  const enabled =
    video[0].enabled;


  video.forEach(

    }
  );


  document
    .getElementById(
      "cameraButton"
    )
    .textContent =

      ? "🚫"
      : "📷";

};


/* =========================================================
   SWITCH CAMERA
========================================================= */

window.switchCamera =
async function(){

  if(!localStream){

    toast(
      "Tidak ada panggilan aktif."
    );

    return;

  }


  const videoTracks =
    localStream
      .getVideoTracks();


  if(!videoTracks.length){

    toast(
      "Ganti kamera hanya tersedia saat video call."
    );

    return;

  }


  const currentTrack =
    videoTracks[0];

  const settings =
    currentTrack.getSettings();


  const currentFacing =
    settings.facingMode ===
      "environment"
    ? "user"
    : "environment";


  try{

    let newStream;


    try{

      newStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            audio:false,
            video:{
              facingMode:{
                exact:
                  currentFacing
              }
            }
          });

    }catch(firstError){

      /*
       * Beberapa HP/browser tidak
       * menerima facingMode exact.
       * Coba kembali dengan facingMode
       * biasa.
       */

      newStream =
        await navigator
          .mediaDevices
          .getUserMedia({
            audio:false,
            video:{
              facingMode:
                currentFacing
            }
          });

    }


    const newTrack =
      newStream
        .getVideoTracks()[0];


    if(!newTrack){

      throw new Error(
        "Kamera baru tidak tersedia."
      );

    }


    const sender =
      peerConnection
        ?.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
              "video"
        );


    if(sender){

      await sender
        .replaceTrack(
          newTrack
        );

    }


    const wasEnabled =
      currentTrack.enabled;


    currentTrack.stop();


    localStream
      .removeTrack(
        currentTrack
      );


    newTrack.enabled =
      wasEnabled;


    localStream
      .addTrack(
        newTrack
      );


    document
      .getElementById(
        "localVideo"
      )
      .srcObject =
      localStream;


  }catch(error){

    console.error(
      "SWITCH CAMERA:",
      error
    );

    toast(
      "Tidak dapat mengganti kamera: " +
      error.message
    );

  }

};


/* =========================================================
   END CALL
========================================================= */

window.endCall =
async function(){

  if(isEndingCall)
    return;

  isEndingCall =
    true;


  const callId =
    currentCall;


  if(callId){

    try{

      await update(
        ref(
          db,
          "calls/" +
          callId
        ),
        {
          status:"ended"
        }
      );

    }catch(error){

      console.error(
        error
      );

    }

  }


  cleanupCall();

};


/* =========================================================
   CLEANUP
========================================================= */

function cleanupCall(){

  stopCallTimer();


  if(callListener){

    try{

      callListener();

    }catch(e){}

    callListener =
      null;

  }


  if(candidateListener){

    try{

      candidateListener();

    }catch(e){}

    candidateListener =
      null;

  }


  if(peerConnection){

    try{

      peerConnection.ontrack =
        null;

      peerConnection.onicecandidate =
        null;

      peerConnection.close();

    }catch(e){}

    peerConnection =
      null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {

          try{

            track.stop();

          }catch(e){}

        }
      );

    localStream =
      null;

  }


  if(remoteStream){

    remoteStream
      .getTracks()
      .forEach(
        track => {

          try{

            track.stop();

          }catch(e){}

        }
      );

  }


  remoteStream =
    null;

  currentCall =
    null;

  pendingCallId =
    null;

  remoteCandidateQueue =
    [];

  processedCandidates =
    new Set();

  remoteDescriptionSet =
    false;

  incomingCallData =
    null;


  const localVideo =
    document.getElementById(
      "localVideo"
    );

  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  document
    .getElementById(
      "callModal"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "incomingCall"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "muteButton"
    )
    .textContent =
      "🎤";


  document
    .getElementById(
      "cameraButton"
    )
    .textContent =
      "📷";


  isEndingCall =
    false;

}


/* =========================================================
   CLEANUP OLD RINGING CALLS
========================================================= */

async function cleanupOwnOldCalls(){

  if(!currentUser)
    return;

  try{

    const snapshot =
      await get(
        ref(db,"calls")
      );

    const calls =
      snapshot.val() || {};

    const entries =
      Object.entries(calls);

    for(
      const [id,call] of entries
    ){

      if(
        !call ||
        call.status !== "ringing"
      )
        continue;


      if(
        call.callerId ===
          currentUser.uid ||
        call.receiverId ===
          currentUser.uid
      ){

        const age =
          Date.now() -
          (call.createdAt || 0);


        /*
         * Panggilan ringing lebih
         * dari 2 menit dianggap
         * sudah tidak aktif.
         */

        if(age > 120000){

          await update(
            ref(
              db,
              "calls/" +
              id
            ),
            {
              status:"ended"
            }
          );

        }

      }

    }

  }catch(error){

    console.error(
      "CLEAN OLD CALLS:",
      error
    );

  }

}
